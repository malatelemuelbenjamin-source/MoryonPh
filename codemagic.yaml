
workflows:
  moryongo-android:
    name: MoryonGo Android AAB
    max_build_duration: 60

    environment:
      node: 22
      java: 21

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build React website and sync Android
        script: npm run cap:sync

      - name: Build Android App Bundle
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab

