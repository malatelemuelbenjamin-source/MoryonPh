
name: Build MoryonPh Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

    

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing keystore secret"
            exit 1
          fi

          CLEAN_KEY=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          printf '%s' "$CLEAN_KEY" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"

          test -s "$RUNNER_TEMP/upload-key.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/upload-key.jks" \
            -storepass "$MYAPP_UPLOAD_STORE_PASSWORD"

          echo "Keystore validation successful."

- name: Build signed Android App Bundle
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-key.jks
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: Verify AAB signature
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MoryonPh-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
